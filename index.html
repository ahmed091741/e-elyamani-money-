<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-apple-touch.png">
<title>حساباتي — ELYAMANI Money</title>
<style>
:root{
  --bg:#F4F2EC; --ink:#000000; --mut:#5c6570; --card:#ffffff; --line:#E2DFD4;
  --black:#000000; --slate:#36454F; --gold:#D4AF37; --white:#FFFFFF;
  --ok:#1f8a4c; --bad:#b3261e; --warn:#D4AF37;
}
@media(prefers-color-scheme:dark){
  :root{ --bg:#000000; --ink:#F4F2EC; --mut:#9aa6b2; --card:#14181D; --line:#2A2F36;
  --ok:#5fd889; --bad:#ff8a7a; --warn:#E6C568; }
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:14px}
h1{font-size:19px;margin:4px 0 12px;letter-spacing:.2px}
h2{font-size:15px;margin:20px 0 8px;color:var(--mut);font-weight:700}
.hero{background:linear-gradient(160deg,var(--black),var(--slate));color:#fff;border-radius:16px;padding:18px;position:relative;overflow:hidden}
.hero .brandline{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.75}
.hero .brandline img{width:20px;height:20px;border-radius:5px}
.hero .motto{border-inline-start:3px solid var(--gold);padding:3px 10px;margin:10px 0 2px;font-weight:700;color:var(--gold)}
.hero .big{font-size:30px;font-weight:800;direction:ltr;text-align:right;margin-top:8px}
.hero .lbl{font-size:12px;opacity:.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{direction:ltr;font-weight:700}.in{color:var(--ok)}.out{color:var(--bad)}.mut{color:var(--mut);font-size:13.5px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--gold);color:#1a1405;font-weight:700}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:0;border-radius:11px;padding:12px 16px;background:var(--black);color:#fff;min-height:46px;font-weight:700}
@media(prefers-color-scheme:dark){button{background:var(--gold);color:#1a1405}}
button.s{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
button.d{background:var(--bad);color:#fff}
button.gold{background:var(--gold);color:#1a1405}
button.block{width:100%;margin:6px 0}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);margin:4px 0 10px;min-height:46px}
label{font-size:13.5px;color:var(--mut);font-weight:600}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:9px 1px;font-size:11.5px;min-height:0;font-weight:600}
nav button.on{color:var(--gold)}
.fab{position:fixed;inset-inline-start:14px;bottom:calc(68px + env(safe-area-inset-bottom));box-shadow:0 6px 16px #0005;border-radius:30px;z-index:6}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.seg button{flex:1 1 auto;padding:9px 6px;font-size:13.5px;min-height:38px}
.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);border:1px solid var(--warn);border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,520px);background:var(--bg);color:var(--ink);max-height:88vh;overflow:auto}
dialog::backdrop{background:#000a}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{padding:7px 12px;min-height:34px;font-size:13px;white-space:nowrap}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:8px 0}
.chk input{width:auto;min-height:0;margin:0}
small.muted{color:var(--mut)}
a{color:inherit}
.statusline{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0}
.statusline>i{display:block;height:100%}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<script>
/* =========================================================================
   LEDGER CORE — pure functions, unit-tested in selfTest()
   ========================================================================= */
const CATS_DEFAULT=['الأكل والشرب','المواصلات','الأسرة','المنزل','العلاج','الاتصالات','الإنترنت','الملابس','التعليم','السفر','الهدايا','المساعدات','الترفيه','العمل الشخصي','الطوارئ','مشتريات شخصية','أخرى'];
const SRC=['عمل','تجارة','عمولة','هدية','استرداد مبلغ','دخل آخر'];
const IMP=['ضروري','مهم','يمكن تأجيله','كمالي'];
const TL={income:'دخل',expense:'مصروف',transfer:'تحويل',saving:'ادخار',debt:'دين',adjust:'تسوية'};

function validate(S,t){
  if(!t.acc||!S.accounts.find(a=>a.id===t.acc))return'اختر الحساب';
  if(t.type==='adjust'){ if(!(Number(t.amount)!==0&&isFinite(Number(t.amount))))return'أدخل مبلغ الفرق'; }
  else if(!(Number(t.amount)>0))return'المبلغ يجب أن يكون أكبر من صفر';
  if(t.type==='transfer'||t.type==='saving'){
    if(!t.to||!S.accounts.find(a=>a.id===t.to))return'اختر الحساب المحوَّل إليه';
    if(t.to===t.acc)return'لا يمكن التحويل إلى نفس الحساب';
    const A=S.accounts.find(a=>a.id===t.acc),B=S.accounts.find(a=>a.id===t.to);
    if(A.cur!==B.cur)return'التحويل بين عملتين مختلفتين غير مدعوم في هذه النسخة — أضف سعر صرف يدويًا بتسجيل عمليتين منفصلتين';
  }
  return null;
}
function delta(t,accId){
  const n=Number(t.amount);
  if(t.type==='income'||t.type==='adjust')return t.acc===accId?n:0;
  if(t.type==='expense')return t.acc===accId?-n:0;
  if(t.type==='transfer'||t.type==='saving')return t.acc===accId?-n:(t.to===accId?n:0);
  return 0;
}
function balance(S,id){const a=S.accounts.find(x=>x.id===id);if(!a)return 0;return S.tx.reduce((s,t)=>s+delta(t,id),Number(a.opening));}
function totals(S){const o={};S.accounts.forEach(a=>o[a.cur]=(o[a.cur]||0)+balance(S,a.id));return o;}
function periodSum(S,type,prefix,cur){return S.tx.filter(t=>t.type===type&&t.date.startsWith(prefix)&&(S.accounts.find(a=>a.id===t.acc)||{}).cur===cur).reduce((s,t)=>s+Number(t.amount),0);}
function isDup(S,t){return S.tx.some(x=>x.type===t.type&&x.acc===t.acc&&Number(x.amount)===Number(t.amount)&&x.date===t.date);}
function addTx(S,t){const e=validate(S,t);if(e)return{error:e};S.tx.push({...t,amount:Number(t.amount),id:'t'+Date.now()+Math.random().toString(36).slice(2,7)});return{ok:true};}
function recon(S,id,real){return balance(S,id)-Number(real);}

/* self-test harness, run in isolated state — never touches live S */
function runSelfTest(){
  const T=fresh();T.accounts=[{id:'b',name:'بنكك',cur:'SDG',opening:1e6},{id:'c',name:'كاش',cur:'SDG',opening:0}];
  const L=[],ck=(n,c)=>L.push((c?'✓ ':'✗ ')+n);
  const B=id=>balance(T,id);
  addTx(T,{type:'income',acc:'b',amount:500000,date:'2026-01-01'});ck('دخل → بنكك 1,500,000',B('b')===1.5e6);
  addTx(T,{type:'expense',acc:'b',amount:200000,date:'2026-01-02'});ck('مصروف → بنكك 1,300,000',B('b')===1.3e6);
  addTx(T,{type:'transfer',acc:'b',to:'c',amount:300000,date:'2026-01-03'});
  ck('تحويل: بنكك 1,000,000 والكاش 300,000',B('b')===1e6&&B('c')===3e5);
  ck('الإجمالي بلا تغيير 1,300,000',totals(T).SDG===1.3e6);
  ck('التحويل لم يغيّر الدخل الشهري',periodSum(T,'income','2026-01','SDG')===5e5);
  ck('التحويل لم يغيّر المصروف الشهري',periodSum(T,'expense','2026-01','SDG')===2e5);
  ck('فرق مطابقة 10,000 عند رصيد بنكي 990,000',recon(T,'b',990000)===10000);
  ck('مصروف صفر يُرفض',!!validate(T,{type:'expense',acc:'b',amount:0}));
  ck('دخل سالب يُرفض',!!validate(T,{type:'income',acc:'b',amount:-5}));
  ck('تحويل لنفس الحساب يُرفض',!!validate(T,{type:'transfer',acc:'b',to:'b',amount:5}));
  ck('عملية بدون حساب تُرفض',!!validate(T,{type:'expense',amount:5}));
  const tid=T.tx.find(t=>t.type==='transfer').id;T.tx=T.tx.filter(t=>t.id!==tid);
  ck('حذف التحويل يعيد الحسابين',B('b')===1.3e6&&B('c')===0);
  addTx(T,{type:'income',acc:'b',amount:100,date:'2026-01-04'});
  const before=B('b');T.tx[T.tx.length-1].amount=50;
  ck('تعديل عملية يُعاد حسابه بشكل صحيح',B('b')===before-50);
  return L;
}

/* =========================================================================
   STORAGE — IndexedDB, whole state as ONE record, written atomically
   ========================================================================= */
/* Storage: IndexedDB when available; silent fallback to localStorage so the
   app never shows a blank screen on browsers/WebViews that restrict IndexedDB
   (private mode, some OEM WebViews, file:// in rare cases). */
let STORAGE_MODE='idb';
const DB=(typeof indexedDB==='undefined')?Promise.reject(new Error('no-idb')):new Promise((res,rej)=>{
  try{
    const r=indexedDB.open('elyamani-money-v2',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  }catch(e){rej(e);}
});
DB.catch(()=>{STORAGE_MODE='ls';});
async function load(){
  try{
    const db=await DB;
    return new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});
  }catch(e){
    STORAGE_MODE='ls';
    try{const v=localStorage.getItem('elyamani-money-state');return v?JSON.parse(v):null;}catch(e2){return null;}
  }
}
async function save(){
  try{
    const db=await DB;
    return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(JSON.parse(JSON.stringify(S)),'state');t.oncomplete=res;t.onerror=()=>rej(t.error);});
  }catch(e){
    STORAGE_MODE='ls';
    try{localStorage.setItem('elyamani-money-state',JSON.stringify(S));}catch(e2){
      if(!window.__storageWarned){window.__storageWarned=true;
        setTimeout(()=>alert('تحذير: تعذّر حفظ البيانات بشكل دائم على هذا المتصفح. قد تُفقد العمليات عند إغلاق التطبيق. جرّب فتح التطبيق من نسخة APK المثبّتة بدلًا من المتصفح، أو فعّل تخزين الموقع في إعدادات المتصفح.'),300);
      }
    }
  }
}
const DEFQ=['لن أستسلم أبدًا.','كل يوم خطوة.','الانضباط اليوم راحة غدًا.','أنا أبني مستقبلي بقرارات اليوم.','كل جنيه أحسن إدارته يقربني من هدفي.','الاستمرار أهم من الكمال.','قرار صغير اليوم يصنع فرقًا غدًا.'];
function fresh(){return{
  v:2,cur:'SDG',accounts:[],tx:[],cats:[...CATS_DEFAULT],
  budget:0,budgetCat:{},
  quotes:DEFQ.map(t=>({t,pin:false,fav:false})),motivation:true,
  goals:[],debts:[],recurring:[],wishlist:[],avoided:0,
  pin:null,pinSalt:null,lastSeen:today(),name:'أحمد',notifyReminders:false,
};}

const $=s=>document.querySelector(s);
const fmt=n=>Number(n||0).toLocaleString('en-US');
function today(){return new Date().toISOString().slice(0,10);}
let S=null,tab='home',locked=false;

function dlg(html){const d=$('#dlg');d.innerHTML=html;d.showModal();return d;}
function accOpts(sel){return S.accounts.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)} (${a.cur})</option>`).join('');}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function accName(id){return(S.accounts.find(a=>a.id===id)||{}).name||'—';}

/* ---------------------------- RENDER ROOT ---------------------------- */
function render(){
  if(locked)return renderLock();
  if(!S.accounts.length)return onboard();
  const nav=[['home','الرئيسية'],['acc','حساباتي'],['tx','العمليات'],['more','المزيد']];
  $('#nav').innerHTML=nav.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const views={home,acc,tx,more,rec,budgetV,debtsV,goalsV,reportsV,settingsV,wishV,recurV,privacyV,catsV,importV};
  $('#app').innerHTML=(views[tab]||home)()+`<button class="fab" onclick="newTx()">+ عملية جديدة</button>`;
}
function go(k){tab=k;render();}

/* ---------------------------- LOCK SCREEN ---------------------------- */
function renderLock(){
  $('#nav').innerHTML='';
  $('#app').innerHTML=`<h1>حساباتي مقفلة</h1><p class="mut">أدخل PIN التطبيق (ليس PIN البنك).</p>
  <input id="lp" type="password" inputmode="numeric" placeholder="PIN" maxlength="12">
  <div id="le" class="warn" hidden></div>
  <button onclick="tryUnlock()">دخول</button>`;
}
async function sha256(text){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function tryUnlock(){
  const h=await sha256(S.pinSalt+$('#lp').value);
  if(h===S.pin){locked=false;render();}
  else{const e=$('#le');e.hidden=false;e.textContent='PIN غير صحيح.';}
}

/* ---------------------------- ONBOARDING ---------------------------- */
function onboard(){
  $('#nav').innerHTML='';
  $('#app').innerHTML=`
  <div class="hero"><div class="brandline"><img src="icon.svg"><span>ELYAMANI</span></div>
  <h1 style="color:#fff">أهلًا بك في ELYAMANI Money</h1>
  <p style="opacity:.85">خطوتان فقط: اختر العملة، ثم أضف أول حساب برصيده الحقيقي اليوم. لا نطلب أي بيانات بنكية — كل شيء يُحفظ على جهازك فقط.</p></div>
  <h2>العملة الأساسية</h2><select id="oc"><option>SDG</option><option>USD</option><option>SAR</option><option>AED</option></select>
  <h2>أول حساب</h2><label>الاسم</label><input id="on" value="بنكك - بنك الخرطوم">
  <label>الرصيد الحقيقي الحالي</label><input id="ob" type="number" inputmode="decimal" placeholder="0">
  <button class="block" onclick="startApp()">ابدأ الاستخدام</button>`;
}
async function startApp(){
  const cur=$('#oc').value,name=$('#on').value.trim(),b=Number($('#ob').value||0);
  if(!name)return alert('اكتب اسم الحساب');
  S.cur=cur;
  S.accounts.push({id:'a'+Date.now(),name,type:'bank',cur,opening:b,note:'',reconDate:null});
  S.accounts.push({id:'a'+(Date.now()+1),name:'الكاش',type:'cash',cur,opening:0,note:'',reconDate:null});
  await save();render();
}

/* ---------------------------- MOTIVATION ---------------------------- */
function quote(){
  if(!S.motivation||!S.quotes.length)return'';
  const pinned=S.quotes.find(q=>q.pin);
  const pick=pinned||S.quotes[new Date().getDate()%S.quotes.length];
  return`<h2>كلمة اليوم</h2><div class="card"><div class="motto" style="border-inline-start:3px solid var(--gold);padding-inline-start:10px;font-weight:700">${esc(pick.t)}</div></div>`;
}

/* ---------------------------- SMART TIPS (local rules, no paid AI) ---------------------------- */
function smartTips(){
  const tips=[];const m=today().slice(0,7);
  const exp=periodSum(S,'expense',m,S.cur);
  if(S.budget){
    const p=exp/S.budget*100;
    if(p>100)tips.push('راجع المصروفات غير الضرورية لبقية الشهر.');
    else if(p>=80)tips.push(`استخدمت ${Math.round(p)}% من ميزانيتك هذا الشهر.`);
    else if(exp>0)tips.push('أداء جيد، استمر.');
  }
  // category comparison vs previous month
  const pm=new Date();pm.setMonth(pm.getMonth()-1);const pmPrefix=pm.toISOString().slice(0,7);
  const byCat=c=>S.tx.filter(t=>t.type==='expense'&&t.cat===c).reduce((acc,t)=>{const mo=t.date.slice(0,7);acc[mo]=(acc[mo]||0)+Number(t.amount);return acc;},{});
  (S.cats||[]).forEach(c=>{
    const agg=byCat(c);const cur=agg[m]||0,prev=agg[pmPrefix]||0;
    if(prev>0&&cur>prev*1.2)tips.push(`مصروف ${c} ارتفع عن الشهر الماضي.`);
  });
  const lastTx=[...S.tx].sort((a,b)=>a.date<b.date?1:-1)[0];
  if(lastTx){const days=Math.floor((Date.now()-new Date(lastTx.date))/864e5);if(days>=3)tips.push('لا تنسَ تحديث مصروفاتك.');}
  return tips;
}

/* ---------------------------- HOME ---------------------------- */
function home(){
  const T=totals(S),m=today().slice(0,7);
  const totLine=Object.entries(T).map(([c,v])=>`<div class="big">${fmt(v)} <small class="lbl">${c}</small></div>`).join('');
  const cur=S.cur;const inc=periodSum(S,'income',m,cur),exp=periodSum(S,'expense',m,cur);
  const left=S.budget?S.budget-exp:null;
  const debtsOwedToMe=S.debts.filter(d=>d.kind==='lent').reduce((s,d)=>s+(Number(d.amount)-Number(d.paid)),0);
  const debtsIOwe=S.debts.filter(d=>d.kind==='owe').reduce((s,d)=>s+(Number(d.amount)-Number(d.paid)),0);
  const last=[...S.tx].sort((a,b)=>a.date<b.date?1:-1).slice(0,5).map(txRow).join('')||'<p class="mut">لا توجد عمليات بعد. اضغط «+ عملية جديدة».</p>';
  const cards=S.accounts.slice(0,4).map(a=>`<div class="card"><div class="mut">${esc(a.name)}</div><div class="num">${fmt(balance(S,a.id))} <small class="lbl">${a.cur}</small></div></div>`).join('');
  const tips=smartTips();
  return`
  <div class="hero">
    <div class="brandline"><img src="icon.svg"><span>ELYAMANI</span></div>
    <div class="lbl">السلام عليكم${S.name?' '+esc(S.name):''}</div>
    <div class="motto">لن أستسلم أبدًا</div>
    <div class="lbl" style="margin-top:10px">إجمالي أموالي</div>
    ${totLine}
  </div>
  <div class="grid2">${cards}</div>
  <h2>هذا الشهر</h2>
  <div class="card row"><span>دخل الشهر</span><span class="num in">${fmt(inc)}</span></div>
  <div class="card row"><span>مصروف الشهر</span><span class="num out">${fmt(exp)}</span></div>
  <div class="card row"><span>باقي الميزانية</span><span class="num">${left===null?'لم تحدد بعد':fmt(left)}</span></div>
  <div class="card row"><span>ديون لي</span><span class="num in">${fmt(debtsOwedToMe)}</span></div>
  <div class="card row"><span>ديون عليّ</span><span class="num out">${fmt(debtsIOwe)}</span></div>
  ${tips.length?`<h2>ملاحظات</h2>`+tips.map(t=>`<div class="card mut">${esc(t)}</div>`).join(''):''}
  <h2>آخر العمليات</h2>${last}
  ${quote()}`;
}

/* ---------------------------- TX ROW / LIST ---------------------------- */
function txRow(t){
  const cls=t.type==='income'||(t.type==='adjust'&&t.amount>0)?'in':(t.type==='transfer'||t.type==='saving')?'':'out';
  const sub=(t.type==='transfer'||t.type==='saving')?`${accName(t.acc)} ← ${accName(t.to)}`:`${accName(t.acc)}${t.cat?' · '+esc(t.cat):''}`;
  return`<div class="card row"><div><b>${TL[t.type]}</b> <span class="mut">${t.date}</span><div class="mut">${sub}${t.note?' — '+esc(t.note):''}</div></div>
  <div style="text-align:left"><span class="num ${cls}">${fmt(t.amount)}</span><br>
  <button class="s" style="padding:3px 9px;min-height:0;font-size:12px" onclick="editTx('${t.id}')">تعديل</button>

let curType='expense',editingId=null;
function newTx(type,existing){
  curType=type||curType;editingId=existing?existing.id:null;
  const t=curType,isT=(t==='transfer'||t==='saving');
  const e=existing||{};
  dlg(`<h2>${editingId?'تعديل عملية':'عملية جديدة'}</h2>
  <div class="seg">${['expense','income','transfer','saving','debt','adjust'].map(k=>`<button class="${k===t?'':'s'}" onclick="newTx('${k}')">${TL[k]}</button>`).join('')}</div>
  ${t==='debt'?debtForm(e):`
  <label>${t==='adjust'?'مبلغ الفرق (سالب للنقص)':'المبلغ'}</label><input id="tm" type="number" inputmode="decimal" value="${e.amount??''}">
  <label>${isT?'من حساب':'الحساب'}</label><select id="ta">${accOpts(e.acc)}</select>
  ${isT?`<label>${t==='saving'?'إلى حساب الادخار':'إلى حساب'}</label><select id="tt">${accOpts(e.to||(S.accounts[1]&&S.accounts[1].id))}</select>`:''}
  ${t==='expense'?`<label>التصنيف</label><select id="tc">${S.cats.map(c=>`<option ${c===e.cat?'selected':''}>${c}</option>`).join('')}</select>
  <label>طريقة الدفع</label><select id="tpm"><option>نقدًا</option><option>تحويل بنكي</option><option>محفظة إلكترونية</option><option>بطاقة</option></select>
  <label>مدى الأهمية</label><select id="ti">${IMP.map(i=>`<option ${i===e.imp?'selected':''}>${i}</option>`).join('')}</select>`:''}
  ${t==='income'?`<label>المصدر</label><select id="tc">${SRC.map(c=>`<option ${c===e.cat?'selected':''}>${c}</option>`).join('')}</select>`:''}
  <label>التاريخ</label><input id="td" type="date" value="${e.date||today()}">
  <label>ملاحظة (اختياري)</label><input id="tn" value="${esc(e.note||'')}">
  <div id="te" class="warn" hidden></div>
  <div class="row"><button onclick="saveTx()">حفظ</button>${editingId?`<button class="d" onclick="delTx('${editingId}');$('#dlg').close()">حذف</button>`:''}<button class="s" onclick="$('#dlg').close()">إلغاء</button></div>`}`);
}
let dupOk=false;
async function saveTx(){
  if(curType==='debt')return saveDebtFromForm();
  const t={type:curType,amount:$('#tm').value,acc:$('#ta').value,to:$('#tt')&&$('#tt').value,
    cat:$('#tc')&&$('#tc').value,pm:$('#tpm')&&$('#tpm').value,imp:$('#ti')&&$('#ti').value,
    date:$('#td').value||today(),note:$('#tn').value};
  const err=validate(S,t);const box=$('#te');
  if(err){box.hidden=false;box.textContent=err;return;}
  if(editingId){
    if(!dupOk&&(t.type==='expense'||t.type==='transfer')&&Number(t.amount)>balance(S,t.acc)+Number(S.tx.find(x=>x.id===editingId).amount)){
      box.hidden=false;box.textContent='المبلغ أكبر من الرصيد المتاح. اضغط «حفظ» مرة أخرى للمتابعة.';dupOk=true;return;
    }
    dupOk=false;
    const i=S.tx.findIndex(x=>x.id===editingId);S.tx[i]={...S.tx[i],...t,amount:Number(t.amount)};
    await save();$('#dlg').close();editingId=null;render();return;
  }
  if(!dupOk&&isDup(S,t)){box.hidden=false;box.textContent='توجد عملية مشابهة (نفس المبلغ والحساب واليوم). اضغط «حفظ» مرة أخرى إن كانت عملية جديدة.';dupOk=true;return;}
  if((t.type==='expense'||t.type==='transfer')&&Number(t.amount)>balance(S,t.acc)&&!dupOk){box.hidden=false;box.textContent='المبلغ أكبر من رصيد الحساب. اضغط «حفظ» مرة أخرى للمتابعة.';dupOk=true;return;}
  dupOk=false;addTx(S,t);await save();
  const m=t.date.slice(0,7);$('#dlg').close();render();
  if(t.type==='expense'&&S.budget){const ex=periodSum(S,'expense',m,S.cur);if(ex>S.budget)setTimeout(()=>alert('تجاوزت ميزانية الشهر. راجع المصروفات غير الضرورية لبقية الشهر.'),50);}
}

  const due=S.recurring.filter(r=>r.day===d);

function importV(){
  return`<h1>استيراد كشف حساب</h1><p class="mut">ارفع ملف CSV. سيُعرض معاينة قبل الحفظ، ويمكنك تحديد الأعمدة يدويًا إن لزم. لا تُستورد أي عملية تلقائيًا بدون مراجعتك.</p>
  <input type="file" id="impf" accept=".csv">
  <label>الحساب المستهدف</label><select id="impacc">${accOpts()}</select>
  <button onclick="parseImport()">معاينة</button>
  <div id="impPreview"></div>`;
}
let importRows=[];
function parseImport(){
  const f=$('#impf').files[0];if(!f)return alert('اختر ملفًا');
  const r=new FileReader();
  r.onload=()=>{
    const text=r.result;const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length)return alert('الملف فارغ');
    const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
    const guess={date:headers.findIndex(h=>/date|تاريخ/i.test(h)),desc:headers.findIndex(h=>/desc|وصف|reference/i.test(h)),
      debit:headers.findIndex(h=>/debit|مدين|سحب/i.test(h)),credit:headers.findIndex(h=>/credit|دائن|إيداع/i.test(h)),
      amount:headers.findIndex(h=>/amount|مبلغ/i.test(h))};
    importRows=lines.slice(1).map(l=>l.split(',').map(c=>c.trim().replace(/^"|"$/g,'')));
    renderImportPreview(headers,guess);
  };
  r.readAsText(f,'utf-8');
}
function renderImportPreview(headers,guess){
  const colOpts=i=>headers.map((h,idx)=>`<option value="${idx}" ${idx===i?'selected':''}>${esc(h)}</option>`).join('')+`<option value="-1">لا يوجد</option>`;
  const unclear=guess.date<0||(guess.debit<0&&guess.credit<0&&guess.amount<0);
  $('#impPreview').innerHTML=`
  ${unclear?'<div class="warn">تعذر اكتشاف الأعمدة تلقائيًا بثقة. حدد الأعمدة يدويًا قبل المتابعة.</div>':''}
  <label>عمود التاريخ</label><select id="colDate">${colOpts(guess.date)}</select>
  <label>عمود الوصف</label><select id="colDesc">${colOpts(guess.desc)}</select>
  <label>عمود مدين (سحب)</label><select id="colDebit">${colOpts(guess.debit)}</select>
  <label>عمود دائن (إيداع)</label><select id="colCredit">${colOpts(guess.credit)}</select>
  <label>أو عمود مبلغ واحد (سالب=مصروف)</label><select id="colAmount">${colOpts(guess.amount)}</select>
  <table style="width:100%;font-size:13px;border-collapse:collapse">${importRows.slice(0,8).map(r=>`<tr>${r.map(c=>`<td style="border-bottom:1px solid var(--line);padding:3px">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>
  <p class="mut">تُعرض أول 8 صفوف فقط للمعاينة. الإجمالي: ${importRows.length} عملية.</p>
  <button onclick="commitImport()">استيراد العمليات بعد المراجعة</button>`;
}
async function commitImport(){
  const cd=Number($('#colDate').value),cdesc=Number($('#colDesc').value),cdeb=Number($('#colDebit').value),ccred=Number($('#colCredit').value),camt=Number($('#colAmount').value);
  if(cd<0)return alert('حدد عمود التاريخ');
  const acc=$('#impacc').value;let added=0,skipped=0;
  importRows.forEach(r=>{
    const date=r[cd];if(!date)return;
    let amt=0,type='expense';
    if(cdeb>=0&&r[cdeb]){amt=Math.abs(Number(r[cdeb].replace(/,/g,''))||0);type='expense';}
    else if(ccred>=0&&r[ccred]){amt=Math.abs(Number(r[ccred].replace(/,/g,''))||0);type='income';}
    else if(camt>=0&&r[camt]){const v=Number(r[camt].replace(/,/g,''))||0;amt=Math.abs(v);type=v<0?'expense':'income';}
    if(!(amt>0))return;
    const note=cdesc>=0?r[cdesc]:'';
    const t={type,acc,amount:amt,date,note,cat:type==='expense'?'أخرى':'دخل آخر'};
    if(isDup(S,t)){skipped++;return;}
    const res=addTx(S,t);if(res.ok)added++;
  });
  await save();alert(`تم استيراد ${added} عملية. تم تجاوز ${skipped} عملية مكررة محتملة.`);render();
}

/* ---------------------------- REPORTS ---------------------------- */
function reportsV(){
  return`<h1>التقارير</h1>
  <div class="seg"><button class="s" onclick="renderReport('day')">اليوم</button><button class="s" onclick="renderReport('week')">الأسبوع</button>
  <button class="s" onclick="renderReport('month')">الشهر</button><button class="s" onclick="renderReport('year')">السنة</button></div>
  <div id="repOut"></div>`;
}
function periodRange(kind){
  const now=new Date();let from;
  if(kind==='day')from=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  else if(kind==='week'){from=new Date(now);from.setDate(now.getDate()-7);}
  else if(kind==='month')from=new Date(now.getFullYear(),now.getMonth(),1);
  else from=new Date(now.getFullYear(),0,1);
  return from.toISOString().slice(0,10);
}
function renderReport(kind){
  const from=periodRange(kind);
  const inRange=S.tx.filter(t=>t.date>=from);
  const inc=inRange.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const exp=inRange.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const sav=inRange.filter(t=>t.type==='saving').reduce((s,t)=>s+Number(t.amount),0);
  const byCat={};inRange.filter(t=>t.type==='expense').forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+Number(t.amount));
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  const biggest=[...inRange.filter(t=>t.type==='expense')].sort((a,b)=>b.amount-a.amount).slice(0,3);
  const days=Math.max(1,Math.round((Date.now()-new Date(from))/864e5));
  const avgDay=exp/days;
  $('#repOut').innerHTML=`
  <div class="card row"><span>الدخل</span><span class="num in">${fmt(inc)}</span></div>
  <div class="card row"><span>المصروف</span><span class="num out">${fmt(exp)}</span></div>
  <div class="card row"><span>الادخار</span><span class="num">${fmt(sav)}</span></div>
  <div class="card row"><span>صافي التدفق</span><span class="num">${fmt(inc-exp)}</span></div>
  <div class="card row"><span>أكثر بند صرفًا</span><span>${top?esc(top[0])+' ('+fmt(top[1])+')':'—'}</span></div>
  <div class="card row"><span>متوسط المصروف اليومي</span><span class="num">${fmt(Math.round(avgDay))}</span></div>
  <h2>أكبر المصروفات</h2>${biggest.map(t=>`<div class="card row"><span>${esc(t.cat||'')} — ${t.date}</span><span class="num out">${fmt(t.amount)}</span></div>`).join('')||'<p class="mut">لا توجد.</p>'}`;
}

function importJSON(f){
  if(!f)return;const r=new FileReader();
  r.onload=async()=>{
    try{
      const o=JSON.parse(r.result);
      if(!Array.isArray(o.accounts)||!Array.isArray(o.tx))throw new Error('bad shape');
      if(!confirm('تحذير: الاسترجاع سيستبدل كل بياناتك الحالية بمحتوى النسخة الاحتياطية. هل تريد المتابعة؟'))return;
      S=Object.assign(fresh(),o);await save();render();
    }catch(e){alert('الملف غير صالح أو تالف.');}
  };
  r.readAsText(f);
}
/* ---- Encrypted backup (AES-GCM via Web Crypto — free, built into the browser, no library) ---- */
async function deriveKey(password,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function exportEncrypted(){
  const pw=prompt('اختر كلمة مرور لهذه النسخة الاحتياطية (احفظها جيدًا — بدونها لا يمكن استرجاع البيانات):');
  if(!pw)return;
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt);
  const data=new TextEncoder().encode(JSON.stringify(S));
  const enc=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data);
  const payload={v:1,salt:Array.from(salt),iv:Array.from(iv),data:Array.from(new Uint8Array(enc))};
  dl(`hisabati-backup-encrypted-${today()}.ebak`,JSON.stringify(payload),'application/octet-stream');
}
function importEncrypted(f){
  if(!f)return;const r=new FileReader();
  r.onload=async()=>{
    try{
      const payload=JSON.parse(r.result);
      const pw=prompt('أدخل كلمة مرور هذه النسخة الاحتياطية:');if(!pw)return;
      const salt=new Uint8Array(payload.salt),iv=new Uint8Array(payload.iv),data=new Uint8Array(payload.data);
      const key=await deriveKey(pw,salt);
      const dec=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
      const o=JSON.parse(new TextDecoder().decode(dec));
      if(!Array.isArray(o.accounts)||!Array.isArray(o.tx))throw new Error('bad shape');
      if(!confirm('تحذير: الاسترجاع سيستبدل كل بياناتك الحالية بمحتوى النسخة الاحتياطية. هل تريد المتابعة؟'))return;
      S=Object.assign(fresh(),o);await save();render();
    }catch(e){alert('تعذّر فك التشفير — تأكد من كلمة المرور أو أن الملف غير تالف.');}
  };
  r.readAsText(f);
}
async function wipe(){
  if(!confirm('سيتم حذف جميع حساباتك وعملياتك وديونك وأهدافك نهائيًا. هل أنت متأكد؟'))return;
  if(!confirm('تأكيد نهائي: لا يمكن التراجع عن هذا الإجراء. هل تريد المتابعة؟'))return;
  S=fresh();await save();render();
}
