name: Build ELYAMANI Money APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor deps
        run: npm install

      - name: Capacitor init (idempotent)
        run: npx cap init "حساباتي" "com.elyamani.money" --web-dir www || true

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elyamani-money-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk elyamani-money-debug.apk

      - name: Publish APK to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" elyamani-money-debug.apk \
            --title "ELYAMANI Money APK (build ${{ github.run_number }})" \
            --notes "Debug APK built automatically from commit ${{ github.sha }}." \
            --repo "${{ github.repository }}"
